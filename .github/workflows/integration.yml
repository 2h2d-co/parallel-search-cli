name: Live API integration

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-api-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Test packed CLI against Parallel API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: api-integration
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.6.14"
          install_args: --locked
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test all CLI behavior and the packed artifact against the real API
        run: npm run test:integration
        env:
          PARALLEL_API_KEY: "${{ secrets.PARALLEL_API_KEY }}"
